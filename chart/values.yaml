# Default values for topology-exporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global: {}

image:
  repository: harbor.res.eng.it/icos/meta-kernel/topology-exporter
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

general:
  ZenohEP: tcp/zenoh-local.default:7447
  AggURL: http://10.160.3.20:30400
  Interval: "10"
  AuthEnabled: "True"

auth:
  ICOSCert: icos-certificate.crt
  PermRegister: app#Register
  PermRead: app#Read
  IAMURL: https://iam.core.icos-staging.10-160-3-151.sslip.io
  IAMRealm: staging-continuum
  IAMId: contrl-1.topology-exporter
  IAMSecret: contrl-1.topology-exporter

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}