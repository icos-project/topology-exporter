apiVersion: v1
kind: Service
metadata:
  name: {{ include "topology-exporter.fullname" . }}
  labels:
    {{- include "topology-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") (not (empty .Values.service.nodePort)) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "topology-exporter.selectorLabels" . | nindent 4 }}